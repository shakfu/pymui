name: Wheels

# Tag pushes build and attach to a GitHub release. PyPI uploads are manual.
on:
  push:
    tags:
      # We tag releases as bare semver (e.g. `0.1.2`). The `v`-prefixed
      # form is also accepted in case the project ever flips convention
      # or someone uses it manually.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      github_release:
        description: Attach to a GitHub release (run from a tag)
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # x86_64
          - ubuntu-24.04-arm    # aarch64
          - macos-15-intel      # x86_64
          - macos-latest        # arm64
          - windows-latest      # AMD64
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.2.1

      - name: Check abi3 symbols
        shell: bash
        run: pipx run abi3audit --strict --report wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # One `dist` artifact holding every wheel and the sdist.
  merge:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: dist
          pattern: "{wheels-*,sdist}"
          delete-merged: true

  github_release:
    needs: merge
    if: github.event_name == 'push' || inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "github_release needs a tag ref; got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: extract release notes from CHANGELOG
        # Pulls the section under `## [<version>]` out of CHANGELOG.md
        # into release-notes.md, prefixed with a "Changes since the last
        # Release" header. The script falls back to `## [Unreleased]` if
        # the version-named section is missing or empty. Exit 0 = found
        # (release body comes from release-notes.md); exit 2 = nothing
        # to use (release body falls back to GitHub's auto-generated
        # commit-list notes).
        # Any other exit code is a script error and fails the job.
        run: |
          rc=0
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" || rc=$?
          case $rc in
            0) echo "FOUND=1" >> "$GITHUB_ENV"; cat release-notes.md ;;
            2) echo "FOUND=0" >> "$GITHUB_ENV" ;;
            *) exit $rc ;;
          esac

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ env.FOUND == '1' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ env.FOUND != '1' }}
